spring.application.name=leaveManager

# ---- Database (MySQL) ----
# Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD if your setup differs.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leave_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA ----
# Tables are created by schema.sql (below), so Hibernate must not touch the schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Run schema.sql on startup (it uses CREATE TABLE IF NOT EXISTS, so it is safe to re-run) ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ---- Demo users created on first start when the employees table is empty ----
app.seed.enabled=true
app.seed.manager-password=manager123
app.seed.employee-password=employee123
